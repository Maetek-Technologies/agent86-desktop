# cargo-deny: dependency checks run in CI (docs/PROJECT_PLAN.md section 5).
# `cargo deny check` in src-tauri runs them locally.

[graph]
all-features = false

[advisories]
# Known vulnerabilities fail the build; unmaintained crates deep in Tauri's and agent86-core's
# trees are reported but do not block.
unmaintained = "none"
yanked = "warn"

[licenses]
# Permissive licenses only, so the app can ship under MIT.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
