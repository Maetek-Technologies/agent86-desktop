[package]
name = "agent86-desktop"
version = "1.2.1"
description = "A desktop app for agent86"
license = "MIT"
edition = "2021"
# agent86-core's minimum supported Rust version.
rust-version = "1.94"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "agent86_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The tray icon (src/desktop.rs) is optional at run time, off by default.
tauri = { version = "2", features = ["tray-icon"] }
# Plugins are used from Rust only; the webview is granted none of their permissions
# (capabilities/default.json, docs/PROJECT_PLAN.md section 5).
tauri-plugin-dialog = "2"
# The app's own log file, read by the Logs view (src/logs.rs).
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Updates from GitHub Releases, verified with the updater key (src/updates.rs).
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Pinned exactly: a few things the app must do as the CLI does sit outside the crate's semver
# promise (the keyring layout, the embedder, the context-window and price tables, `Memory::store()`;
# docs/PROJECT_PLAN.md D2, risks), all in src/unstable.rs. Default features stay on: the OS
# keyring and `local-embeddings`, so memory shared with the CLI uses the CLI's embedder.
agent86-core = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Each thread actor runs its own current-thread runtime (src/threads/actor.rs).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# The workspace walk behind `@` mentions; agent86-core already depends on it.
ignore = "0.4"
# Parsing the agent86 CLI's config.toml for the one-time import (src/cli_import.rs).
toml = "1"
# Hashing what a project would load, for project trust (src/trust.rs); agent86-core uses it too.
sha2 = "0.11"
# TypeScript types for the IPC contract, written to src/desktop-client/generated by `cargo test`.
# Decoding surface media URLs (src/surface_media.rs); already in the tree through url.
percent-encoding = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

# The elevation check at startup (src/elevation.rs); already in the tree through tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
