name: Release

# Push a tag `vX.Y.Z` (matching package.json) to build installers for every platform into a DRAFT
# GitHub Release, with `latest.json` for the in-app updater. Publish the draft by hand once its
# assets look right; the updater only offers published releases (docs/RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: ""
    env:
      # Required: the updater key (tauri signer). Without it no update artifacts can be signed.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Optional code signing; each platform is signed only when its secrets are set.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches package.json and the updater key is set
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set (docs/RELEASING.md)"
            exit 1
          fi

      - name: Linux system libraries for WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Windows: Authenticode, when WINDOWS_CERTIFICATE (a base64 .pfx) is set.
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.signing.json -Value $config
          "TAURI_EXTRA_ARGS=--config src-tauri/tauri.signing.json" | Out-File -Append $env:GITHUB_ENV

      # macOS: Developer ID signing and notarization, when APPLE_CERTIFICATE is set. The Tauri
      # bundler reads these variables; leaving them unset builds an unsigned app.
      - name: Use the Apple signing identity
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_SECRET != ''
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agent 86 ${{ github.ref_name }}
          releaseBody: |
            Installers for Windows, macOS (Apple Silicon and Intel), and Linux are below; see the
            [user guide](https://github.com/Maetek-Technologies/agent86-desktop/blob/main/docs/USER_GUIDE.md)
            for which to pick and what to expect the first time you open it.
          releaseDraft: true
          prerelease: false
          # Per-user NSIS installs update without an administrator prompt.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

  updater-urls:
    # tauri-action writes GitHub API asset URLs into latest.json while the release is a draft.
    # Point them at the release's download links instead, which are not rate-limited.
    name: latest.json download links
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Rewrite the updater URLs
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -D out
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | \"\(.id)\t\(.name)\"" > out/assets.tsv
          python3 - <<'PY'
          import json, os
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          ids = dict(line.rstrip("\n").split("\t") for line in open("out/assets.tsv"))
          manifest = json.load(open("out/latest.json"))
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          for platform in manifest["platforms"].values():
              asset = platform["url"].rsplit("/", 1)[-1]
              if asset in ids:
                  platform["url"] = base + ids[asset]
          json.dump(manifest, open("out/latest.json", "w"), indent=2)
          PY
          gh release upload "$TAG" out/latest.json --clobber -R "$GITHUB_REPOSITORY"
